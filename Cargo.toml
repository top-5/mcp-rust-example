[package]
name = "mcp-rust-example"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Top-5 <top-5@noname.org>"]
description = "MCP (Model Context Protocol) HTTP server implementation using the official Rust SDK"
repository = "https://github.com/top-5/mcp-rust-example"

[dependencies]
# Official MCP Rust SDK
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", features = [
    "server",
    "client", 
    "transport-streamable-http-server",
    "transport-streamable-http-client-reqwest"  # Use reqwest client for convenience methods
] }

# Required dependencies for MCP server
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
clap = { version = "4.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Authentication and configuration
jsonwebtoken = "9.0"
configparser = "3.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
rand = "0.9"

[[bin]]
name = "mcp-server"
path = "src/bin/mcp_server.rs"

[[bin]]
name = "launcher"
path = "src/bin/launcher.rs"

[[bin]]
name = "token-manager"
path = "src/bin/token_manager.rs"
