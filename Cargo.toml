[package]
name = "mcp-rust-example"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Top-5 <top-5@noname.org>"]
description = "MCP (Model Context Protocol) HTTP server implementation using the official Rust SDK"
repository = "https://github.com/top-5/mcp-rust-example"

[dependencies]
# Official MCP Rust SDK
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", features = [
    "server",
    "client", 
    "transport-streamable-http-server",
    "transport-streamable-http-client"
] }

# Required dependencies for MCP server
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
clap = { version = "4.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "mcp-server"
path = "src/bin/mcp_server.rs"

[[bin]]
name = "launcher"
path = "src/bin/launcher.rs"
